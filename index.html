            return (

                        <rect x="55" y="120" width="40" height="20" rx="5" fill="#ef4444" />
                        <rect x="305" y="120" width="40" height="20" rx="5" fill="#ef4444" />
                        <rect x="110" y="125" width="180" height="50" rx="6" fill="white" stroke="#bae6fd" strokeWidth="2" />
                    </svg>
                    <div className="absolute top-[71%] left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-3 font-bold select-none tracking-tighter">
                        <div className="flex gap-0.5">
                            {digits.slice(0, 2).map((d, i) => {

                                return (

                        <span className="text-sky-600 text-lg md:text-xl">가</span>
                        <div className="flex gap-1">
                            {digits.slice(2).map((d, i) => {

        };

        const App = () => {
            const [view, setView] = useState("main"); // main, teacherSetup, teacherDashboard, studentJoin, driving, solving, tutorial

            const [nicknameError, setNicknameError] = useState("");

            // 실시간 교실용 동기화 상태
            const [roomPin, setRoomPin] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [studentList, setStudentList] = useState([]); // 교사용 학생 리스트
            const [teacherModeSelected, setTeacherModeSelected] = useState("beginner"); // 교사가 개설할 방 난이도

            // 파이어베이스 인증 여부 상태
            const [firebaseUser, setFirebaseUser] = useState(null);

            // 누적 명예의 전당 상태 및 저장 모달 제어
            const [globalLeaderboard, setGlobalLeaderboard] = useState([]);
            const [showSaveScoreModal, setShowSaveScoreModal] = useState(false);
            const [saveScoreName, setSaveScoreName] = useState("");

            // Gemini API 연동 상태
            const [aiHintText, setAiHintText] = useState("");
            const [aiLoading, setAiLoading] = useState(false);
            const [showAiModal, setShowAiModal] = useState(false);

            // 주행 물리 가속 제어
            const [speed, setSpeed] = useState(0);
            const [keysPressed, setKeysPressed] = useState({ up: false, left: false, right: false });

            // 문제별 타이머 및 힌트 팝업 상태
            const [problemTimer, setProblemTimer] = useState(0);
            const [showHintModal, setShowHintModal] = useState(false);

            // Canvas 레퍼런스
            const canvasRef = useRef(null);
            const animationFrameRef = useRef(null);

            // 드라이빙 엔티티 상태 (좌우 스티어링 및 터치 제어)
            const drivingState = useRef({
                roadOffset: 0,

                playerY: 340,
                targetCarY: -150,
                targetCarPlate: [8, 7, 5, 9, 3, 2],

            });

            // 종합 4단계 학습 가이드 슬라이드 데이터
            const tutorials = [
                { title: "규칙 1. 순서대로 계산하기", desc: "더하기(+)와 빼기(-)만 있을 때는 무조건 앞에서부터 순서대로 계산해요.", ex: "15 - 5 + 3 = 10 + 3 = 13" },
                { title: "규칙 2. 곱하기를 먼저!", desc: "더하기(+), 빼기(-)보다 곱하기(×)를 무조건 먼저 해야 해요.", ex: "4 + 2 × 5 = 4 + 10 = 14" },
                { title: "규칙 3. 나누기도 힘이 세요!", desc: "곱하기(×)와 마찬가지로 나누기(÷)도 더하기, 빼기보다 먼저 계산해요.", ex: "12 - 6 ÷ 2 = 12 - 3 = 9" },
                { title: "규칙 4. 무적의 해결사 괄호 ( )", desc: "괄호 ( )가 보이면 모든 규칙을 무시하고 괄호 안을 1등으로 계산해요!", ex: "(4 + 2) × 5 = 6 × 5 = 30" }
            ];

            // RULE 3 - Auth Before Queries (선인증 가드 및 명예의 전당 데이터 조회)
            useEffect(() => {
                if (!isConfigValid) return;
                const auth = firebase.auth();
                const initAuth = async () => {
                    try {
                        let user = auth.currentUser;
                        if (!user) {

                        setFirebaseUser(user);
                    } catch (e) {
                        console.warn("인증 실패, 재호출 진행:", e);
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setFirebaseUser(user);
                });
                return () => unsubscribe();
            }, []);

            // 명예의 전당 실시간 누적 구독 (RULE 1, 2 준수 - Compound Query 없이 수동 인메모리 정렬)
            useEffect(() => {
                if (!db || !firebaseUser) return;
                
                const leaderboardRef = db.collection("artifacts").doc(appId).collection("public").doc("data").collection("leaderboard");
                const unsubscribe = leaderboardRef.onSnapshot((snapshot) => {
                    const temp = [];
                    snapshot.forEach((doc) => {
                        temp.push(doc.data());
                    });
                    // RULE 2 에 따른 JS 메모리 내 정렬
                    temp.sort((a, b) => (b.score || 0) - (a.score || 0));
                    setGlobalLeaderboard(temp.slice(0, 5));
                }, (err) => {
                    console.error("명예의 전당 구독 에러:", err);
                });

                return () => unsubscribe();
            }, [firebaseUser]);

            const evaluateNoParen = (str) => {
                const tokens = [];
                let i = 0;
                while (i < str.length) {
                    const c = str[i];
                    if (/[0-9]/.test(c)) {
                        let numStr = "";
                        while (i < str.length && /[0-9]/.test(str[i])) { numStr += str[i]; i++; }
                        tokens.push(parseInt(numStr));
                    } else if (c === '-' && (tokens.length === 0 || ['+', '-', '*', '/'].includes(tokens[tokens.length - 1]))) {
                        throw new Error("음수 사용 불가");
                    } else if (['+', '-', '*', '/'].includes(c)) {
                        tokens.push(c); i++;
                    } else { i++; }
                }

                let j = 0;
                const tempTokens = [];
                while (j < tokens.length) {
                    const token = tokens[j];
                    if (token === '*' || token === '/') {
                        const left = tempTokens.pop();
                        const right = tokens[j + 1];
                        if (left === undefined || right === undefined) throw new Error("문법 오류");
                        if (left < 0 || right < 0) throw new Error("음수 연산 불가");
                        if (token === '*') {
                            if (left === 0 || right === 0) throw new Error("0 곱하기 제한");
                            tempTokens.push(left * right);
                        } else {
                            if (right === 0 || left % right !== 0) throw new Error("나눗셈 제한");
                            tempTokens.push(left / right);
                        }
                        j += 2;
                    } else { tempTokens.push(token); j++; }
                }

                if (tempTokens.length === 0) return 0;
                let result = tempTokens[0];
                if (result < 0) throw new Error("음수 발생");
                let k = 1;
                while (k < tempTokens.length) {
                    const op = tempTokens[k];
                    const nextVal = tempTokens[k + 1];
                    if (nextVal === undefined) throw new Error("문법 오류");
                    if (nextVal < 0) throw new Error("음수 연산 불가");
                    if (op === '+') {
                        result += nextVal;
                    } else if (op === '-') {
                        result -= nextVal;
                        if (result < 0) throw new Error("중간 계산 결과 음수 발생"); 
                    }
                    k += 2;
                }
                return result;
            };

            const evaluateSafe = (str) => {
                let s = str.replace(/×/g, '*').replace(/÷/g, '/');
                const parenRegex = /\(([^()]+)\)/g;
                let match;
                while ((match = parenRegex.exec(s)) !== null) {
                    const subExpr = match[1];
                    const subVal = evaluateNoParen(subExpr);
                    if (subVal < 0 || !Number.isInteger(subVal)) throw new Error("중간값 안전 범위 초과");
                    
                    const matchIndex = match.index;
                    const charBefore = s[matchIndex - 1];
                    const charAfter = s[matchIndex + match[0].length];
                    if (subVal === 0 && (charBefore === '*' || charAfter === '*')) {
                        throw new Error("편법 식 감지");
                    }
                    s = s.substring(0, matchIndex) + subVal + s.substring(matchIndex + match[0].length);
                    parenRegex.lastIndex = 0;
                }
                const finalVal = evaluateNoParen(s);
                if (finalVal < 0 || !Number.isInteger(finalVal)) throw new Error("최종값 범위 초과");
                return finalVal;
            };

            const generateAdvancedHint = (digits) => {
                const ops = ['+', '-', '*'];
                const permute = (arr) => {
                    if (arr.length === 0) return [[]];
                    return arr.flatMap((v, i) => permute(arr.filter((_, j) => i !== j)).map(p => [v, ...p]));
                };
                const digitPerms = permute(digits);

                const templates = [
                    (p, o) => `${p[0]}${o[0]}${p[1]}${o[1]}${p[2]}${o[2]}${p[3]}`,
                    (p, o) => `(${p[0]}${o[0]}${p[1]})${o[1]}${p[2]}${o[2]}${p[3]}`,
                    (p, o) => `${p[0]}${o[0]}(${p[1]}${o[1]}${p[2]})${o[2]}${p[3]}`,
                    (p, o) => `${p[0]}${o[0]}${p[1]}${o[1]}(${p[2]}${o[2]}${p[3]})`,
                    (p, o) => `(${p[0]}${o[0]}${p[1]})${o[1]}(${p[2]}${o[2]}${p[3]})`
                ];

                for (let p of digitPerms) {
                    for (let o1 of ops) {
                        for (let o2 of ops) {
                            for (let o3 of ops) {
                                const opComb = [o1, o2, o3];
                                for (let temp of templates) {
                                    const formula = temp(p, opComb);
                                    try {
                                        if (evaluateSafe(formula) === 0) {
                                            const numRegex = /\d+/g;
                                            const matches = [];
                                            let m;
                                            while ((m = numRegex.exec(formula)) !== null) {
                                                matches.push({ val: m[0], idx: m.index });
                                            }
                                            if (matches.length >= 2) {
                                                const idx1 = Math.floor(Math.random() * matches.length);
                                                let idx2 = Math.floor(Math.random() * matches.length);
                                                while (idx2 === idx1) { idx2 = Math.floor(Math.random() * matches.length); }
                                                
                                                const toReplace = [matches[idx1], matches[idx2]].sort((a,b) => b.idx - a.idx);
                                                let masked = formula;
                                                toReplace.forEach(item => {
                                                    masked = masked.substring(0, item.idx) + "□" + masked.substring(item.idx + item.val.length);
                                                });
                                                return masked.replace(/\*/g, '×').replace(/\//g, '÷');
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                        }
                    }
                }
                return "□ + □ - □ + □";
            };

            const generateProblemForCar = (mode, plateDigits) => {
                let digits = [...plateDigits];
                let ops, target, blankIdx = -1;

                if (mode === "pro") {
                    const proDigits = digits.slice(2);
                    const hintForm = generateAdvancedHint(proDigits);
                    setProblem({ mode, digits: proDigits, hint: hintForm });
                    setExpression([]);
                } else if (mode === "mid") {
                    let success = false;
                    let safetyCounter = 0;
                    let chosenTemplate = "triple_pair";
                    const templatesList = ["triple_pair", "double_triple", "flat_mixed"];
                    
                    while(!success && safetyCounter < 600) { 
                        safetyCounter++;
                        const tType = templatesList[Math.floor(Math.random() * templatesList.length)];
                        const availableOps = ["+", "-", "×", "÷"];
                        
                        ops = [
                            availableOps[Math.floor(Math.random()*4)], 
                            availableOps[Math.floor(Math.random()*4)], 
                            availableOps[Math.floor(Math.random()*4)], 
                            availableOps[Math.floor(Math.random()*4)], 
                            availableOps[Math.floor(Math.random()*4)]  
                        ];
                        
                        try {
                            const d = digits;
                            const o = ops;
                            let formula = "";

                            if (tType === "triple_pair") {
                                const val1 = evaluateSafe(`${d[0]}${o[0]}${d[1]}`);
                                const val2 = evaluateSafe(`${d[2]}${o[2]}${d[3]}`);
                                const val3 = evaluateSafe(`${d[4]}${o[4]}${d[5]}`);
                                if (val1 < 0 || val2 < 0 || val3 < 0) throw new Error("음수");

                                formula = `(${d[0]}${o[0]}${d[1]})${o[1]}(${d[2]}${o[2]}${d[3]})${o[3]}(${d[4]}${o[4]}${d[5]})`;
                            } else if (tType === "double_triple") {
                                const val1 = evaluateSafe(`${d[0]}${o[0]}${d[1]}${o[1]}${d[2]}`);
                                const val2 = evaluateSafe(`${d[3]}${o[3]}${d[4]}${o[4]}${d[5]}`);
                                if (val1 < 0 || val2 < 0) throw new Error("음수");

                                formula = `(${d[0]}${o[0]}${d[1]}${o[1]}${d[2]})${o[2]}(${d[3]}${o[3]}${d[4]}${o[4]}${d[5]})`;
                            } else if (tType === "flat_mixed") {
                                formula = `${d[0]}${o[0]}${d[1]}${o[1]}${d[2]}${o[2]}${d[3]}${o[3]}${d[4]}${o[4]}${d[5]}`;
                            }

                            const val = evaluateSafe(formula);
                            if (val > 0 && val < 150 && Number.isInteger(val)) {
                                target = val;
                                chosenTemplate = tType;
                                success = true;
                            }
                        } catch(e) {}
                    }
                    if(!success) {
                        ops = ["+", "+", "+", "+", "+"];
                        target = digits.reduce((acc, curr) => acc + curr, 0);
                        chosenTemplate = "flat_mixed";
                    }
                    blankIdx = Math.floor(Math.random() * 6);
                    setProblem({ mode, digits, ops, target, blankIdx, templateType: chosenTemplate });
                } else {
                    const beginnerDigits = digits.slice(2);
                    let success = false;
                    let safetyCounter = 0;
                    while(!success && safetyCounter < 300) {
                        safetyCounter++;
                        const availableOps = ["+", "-", "×", "÷"];
                        ops = [availableOps[Math.floor(Math.random()*4)], availableOps[Math.floor(Math.random()*4)], availableOps[Math.floor(Math.random()*4)]];
                        
                        try {
                            const formula = beginnerDigits.map((d, i) => d + (ops[i] ? ops[i] : "")).join("");
                            const val = evaluateSafe(formula);
                            if (val > 0 && val < 100) {
                                target = val;
                                success = true;
                            }
                        } catch(e) {}
                    }
                    if(!success) {
                        ops = ["+", "+", "-"];
                        target = beginnerDigits[0] + beginnerDigits[1] + beginnerDigits[2] - beginnerDigits[3];
                        if (target < 0) target = beginnerDigits.reduce((acc, c) => acc + c, 0);
                    }
                    setProblem({ mode, digits: beginnerDigits, ops, target, blankIdx: -1 });
                }
                setAnswerInput("");
                setIsProblemSolved(false);
                setProblemTimer(0);
                setShowHintModal(false);
                setFeedback({ text: mode === "pro" ? "숫자 4개를 모두 사용해 0을 만드세요!" : "빈칸에 알맞은 숫자를 적고 엔터 또는 확인을 누르세요!", type: "info" });

            // Gemini API 활용 수학 튜터 피드백 호출 (Exponential Backoff 내장)
            const handleAskAITutor = async () => {

                    : `주어진 숫자 카드 ${problem.digits.join(", ")}을 사칙연산과 괄호로 묶어 최종값 0을 만드는 퍼즐`;

                const systemPrompt = "너는 초등학교 5학년 학생들을 위한 상냥하고 격려 넘치는 AI 수학 멘토 선생님이야. 학생들이 고속도로 수학왕 게임에서 혼합계산 문제를 풀 때 수학 원리를 가르쳐 줘야 해. 절대 정답을 바로 말해주지 말고, 괄호가 있는지, 곱셈과 나눗셈을 덧셈/뺄셈보다 왜 먼저 계산해야 하는지 등 수식 우선순위를 친근한 한국어로 흥미롭게 설명해 줘. 짧고 한눈에 들어오는 문장으로 작성하고 이모티콘을 적극 사용해줘.";
                const userQuery = `현재 학생이 풀고 있는 수식 상황: ${currentFormula}. 5학년 학생의 눈높이에 맞춰 직접적인 답은 비밀로 하되, 식을 푸는 원리와 우선순위에 대한 맞춤형 힌트를 3줄 내외로 제안해 줘!`;

                const apiKey = ""; // Runtime 환경 자동 주입
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {

                for (let i = 0; i < 5; i++) {

                            success = true;

                        }
                    } catch (err) {

                    }

            // 학생용 실시간 핀번호 입장 처리 (RULE 1, 3 준수)

            // 실시간 2D Canvas 주행 물리 업데이트 및 렌더링 루프
            useEffect(() => {

                const updatePhysicsAndDraw = () => {
                    const state = drivingState.current;

                    let targetSpeed = 0;
                    if (view === "solving") {
                        targetSpeed = 0;
                    } else if (state.boosterActive) {
                        targetSpeed = 160; 
                        state.boosterTimer -= 1;
                        if (state.boosterTimer <= 0) {
                            state.boosterActive = false;
                        }
                    } else if (state.isAccelerating) {
                        targetSpeed = 100; 
                    }

                    let currentSpeed = state.speed;
                    if (currentSpeed < targetSpeed) {
                        currentSpeed += 2;
                    } else if (currentSpeed > targetSpeed) {
                        currentSpeed -= 3;
                    }
                    if (currentSpeed < 0) currentSpeed = 0;
                    state.speed = currentSpeed;

                    if (view === "driving") {
                        setSpeed(Math.floor(currentSpeed));
                    } else {
                        setSpeed(0);
                    }

                    const activeSpeed = view === "solving" ? 0 : currentSpeed;
                    state.roadOffset = (state.roadOffset + (activeSpeed * 0.15)) % 60;

                    if (view === "driving") {
                        if (state.isSteeringLeft) {
                            state.playerX = Math.max(80, state.playerX - 4);
                        }
                        if (state.isSteeringRight) {
                            state.playerX = Math.min(320, state.playerX + 4);
                        }
                    }

                    if (state.targetCarSpawned && !state.isCollisionTriggered) {
                        state.targetCarY += (activeSpeed * 0.05);

                        if (state.targetCarY >= state.playerY - 85) {
                            state.targetCarY = state.playerY - 85;
                            state.isCollisionTriggered = true;
                            state.isAccelerating = false;

                    ctx.fillRect(50, 0, canvas.width - 100, canvas.height);

                    ctx.fillRect(45, 0, 5, canvas.height);
                    ctx.fillRect(canvas.width - 50, 0, 5, canvas.height);

                    ctx.fillRect(pX + 6, pY + 20, 48, 25);

                    ctx.fillRect(pX + 22, pY + 2, 6, 76);

            }, [view, gameMode]);

            // 키보드 입력을 리슨하는 주행 컨트롤러
            useEffect(() => {

                const handleKeyDown = (e) => {
                    if (view === "solving") return; 

                    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {

                        setKeysPressed(prev => ({ ...prev, up: true }));

                        setKeysPressed(prev => ({ ...prev, left: true }));
                    }

                        drivingState.current.isSteeringRight = true;
                        setKeysPressed(prev => ({ ...prev, right: true }));
                    }
                };

                const handleKeyUp = (e) => {
                    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {

                        setKeysPressed(prev => ({ ...prev, up: false }));
                    }

                        setKeysPressed(prev => ({ ...prev, right: false }));
                    }
                };

                window.addEventListener("keydown", handleKeyDown);

            }, [view]);

            const handleCanvasInteraction = (clientX, rect) => {

                const relativeX = clientX - rect.left;
                const width = rect.width;
                if (relativeX < width / 2) {
                    drivingState.current.isSteeringLeft = true;
                    drivingState.current.isSteeringRight = false;
                    setKeysPressed(prev => ({ ...prev, left: true, right: false }));
                } else {

                    drivingState.current.isSteeringLeft = false;

                setKeysPressed(prev => ({ ...prev, up: true }));

            const handleTouchStart = (e) => {

                drivingState.current.isSteeringRight = false;
                drivingState.current.isAccelerating = false;
                setKeysPressed({ up: false, left: false, right: false });

            const checkPro = () => {
                if (isProblemSolved) return;
