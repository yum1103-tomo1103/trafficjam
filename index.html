                    setFeedback({ text: "번호판의 숫자 4개를 빠짐없이 모두 사용해야 합니다!", type: "error" });
                    return;
                }
                
                const str = expression.map(e => e.value).join('').replace(/×/g, '*').replace(/÷/g, '/');
                try {
                    const result = evaluateSafe(str);
                    if (result === 0) {
                        setIsProblemSolved(true); 
                        setFeedback({ text: "완벽해요! 아름다운 수식으로 0을 만들었습니다! 🏆 부스터 가동!", type: "success" });
                        
                        const nextScore = score + 50;
                        const nextSolved = Math.floor(nextScore / 50);
                        setScore(nextScore);

                        // 교사 관리 도구 실시간 싱크업
                        syncStudentScore(nextScore, nextSolved);

                        setTimeout(() => {
                            drivingState.current = {
                                ...drivingState.current,
                                playerX: 200,
                                targetCarSpawned: false,
                                isCollisionTriggered: false,
                                boosterActive: true,
                                boosterTimer: 120
                            };
                            setView("driving");

                            setTimeout(() => {
                                drivingState.current.targetCarY = -200;
                                drivingState.current.targetCarPlate = generateValidPlate(gameMode);
                                drivingState.current.targetCarSpawned = true;
                            }, 2000);

                        }, 2000);
                    } else { 
                        setFeedback({ text: `계산 결과가 ${result}입니다. 다시 한 번 0을 만들어 보세요!`, type: "error" }); 
                    }
                } catch(e) { 
                    setFeedback({ text: "계산식이 올바르지 않습니다. 괄호 짝이나 부호를 확인해 주세요!", type: "error" });
                }
            };

            const startSingleMode = (mode) => {
                setNickname("도전자");
                setGameMode(mode);
                setRoomPin(""); 
                setScore(0);
                setTimer(0);
                setShowSingleModes(false); 
                startDrivingPhysics(mode);
            };

            if (view === "main") return (
                <div className="min-h-screen flex flex-col md:flex-row items-center justify-center p-8 gap-16 bg-sky-50 relative overflow-hidden">
                    <div className="flex-1 text-center md:text-left z-10 space-y-6">
                        <h1 className="text-7xl md:text-[8rem] font-title text-indigo-950 tracking-tighter leading-none drop-shadow-md">
                            고속도로<br/><span className="text-sky-500">수학왕</span>
                        </h1>
                        <p className="text-indigo-600 text-xl font-bold italic">“길 위에서 스쳐 지나는 숫자로 푸는 재미있는 수학 교실”</p>
                        
                        {/* 실시간 누적 명예의 전당 (Persistent Leaderboard) 카드뷰 */}
                        <div className="bg-white/80 backdrop-blur-sm p-6 rounded-[32px] border border-sky-100 max-w-md shadow-md scale-in mt-4">
                            <h3 className="text-md font-black text-indigo-950 mb-3 flex items-center gap-2">
                                <span>🏆 실시간 전교 명예의 전당</span>
                                <span className="bg-sky-100 text-sky-600 text-[10px] px-2.5 py-0.5 rounded-full font-bold">TOP 5</span>
                            </h3>
                            <div className="divide-y divide-sky-100/60">
                                {globalLeaderboard.length === 0 ? (
                                    <p className="text-xs text-slate-400 py-3 text-center">첫 명예의 전당 주인공에 도전해보세요!</p>
                                ) : (
                                    globalLeaderboard.map((item, idx) => (
                                        <div key={idx} className="flex justify-between items-center py-2 text-sm">
                                            <div className="flex items-center gap-3">
                                                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${idx === 0 ? 'bg-yellow-400 text-white' : idx === 1 ? 'bg-slate-300 text-white' : idx === 2 ? 'bg-amber-600 text-white' : 'bg-sky-100 text-sky-700'}`}>{idx + 1}</span>
                                                <span className="font-bold text-slate-700">{item.nickname}</span>
                                            </div>
                                            <span className="font-black text-sky-600 font-mono">{item.score} 점</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 w-full max-w-sm space-y-6 z-10 bg-white p-6 rounded-[40px] border border-sky-100 shadow-xl">
                        {/* 1. 교사용 관리 포털 버튼 */}
                        <div className="border-b border-sky-100 pb-4">
                            <p className="text-slate-500 text-xs font-bold mb-2">교실용 제어 메뉴</p>
                            <button onClick={() => setView("teacherSetup")} className="w-full p-5 bg-sky-500 hover:bg-sky-600 rounded-[28px] btn-3d font-black text-xl text-white">🏫 교사용 대시보드 개설</button>
                        </div>

                        {/* 2. 학생용 입장 포털 버튼 */}
                        <div className="border-b border-sky-100 pb-4">
                            <p className="text-slate-500 text-xs font-bold mb-2">실시간 수업 참가</p>
                            <button onClick={() => setView("studentJoin")} className="w-full p-5 bg-yellow-400 hover:bg-yellow-500 rounded-[28px] btn-3d font-black text-xl text-slate-900">📱 학생용 실시간 입장</button>
                        </div>

                        {/* 3. 혼자 하기 모드 */}
                        <div>
                            <p className="text-slate-500 text-xs font-bold mb-2">혼자 도전하기</p>
                            {!showSingleModes ? (
                                <button onClick={() => setShowSingleModes(true)} className="w-full p-5 bg-emerald-500 hover:bg-emerald-600 rounded-[28px] btn-3d font-black text-xl text-white">🕹️ 혼자 도전하기</button>
                            ) : (
                                <div className="space-y-3 scale-in">
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => startSingleMode("beginner")} className="p-3 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-black text-sm text-white">초급</button>
                                        <button onClick={() => startSingleMode("mid")} className="p-3 bg-orange-500 hover:bg-orange-600 rounded-2xl font-black text-sm text-white">중급</button>
                                        <button onClick={() => startSingleMode("pro")} className="p-3 bg-rose-500 hover:bg-rose-600 rounded-2xl font-black text-sm text-white">고급</button>
                                    </div>
                                    <button onClick={() => setShowSingleModes(false)} className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl font-bold text-xs transition-colors">접기</button>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="fixed bottom-0 w-full h-32 road-line"></div>
                </div>
            );

            if (view === "tutorial") return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-sky-100">
                    <div className="bg-white rounded-[40px] p-10 max-w-lg w-full text-center shadow-2xl scale-in">
                        <h2 className="text-2xl font-black mb-6 text-sky-600">{tutorials[tutoStep].title}</h2>
                        <div className="bg-slate-50 p-8 rounded-3xl mb-10 border-2 border-slate-100 text-left">
                            <p className="font-bold text-slate-600 mb-6 text-lg">{tutorials[tutoStep].desc}</p>
                            <div className="text-3xl font-black text-sky-500 text-center tracking-tight">{tutorials[tutoStep].ex}</div>
                        </div>
                        <div className="flex gap-4">
                            {tutoStep === 0 && (
                                <React.Fragment>
                                    <button onClick={() => setTutoStep(s => s + 1)} className="flex-1 py-5 bg-sky-500 text-white rounded-2xl font-bold">다음</button>
                                    <button onClick={() => { setView("studentJoin"); setTutoStep(0); }} className="flex-1 py-5 bg-slate-100 hover:bg-slate-200 rounded-2xl font-bold text-slate-600 transition-colors">나가기</button>
                                </React.Fragment>
                            )}
                            {(tutoStep === 1 || tutoStep === 2) && (
                                <React.Fragment>
                                    <button onClick={() => setTutoStep(s => s - 1)} className="flex-1 py-5 bg-slate-100 rounded-2xl font-bold text-slate-600 hover:bg-slate-200 transition-colors">이전</button>
                                    <button onClick={() => setTutoStep(s => s + 1)} className="flex-1 py-5 bg-sky-500 text-white rounded-2xl font-bold">다음</button>
                                    <button onClick={() => { setView("studentJoin"); setTutoStep(0); }} className="flex-1 py-5 bg-slate-200 rounded-2xl font-bold text-slate-700 hover:bg-slate-300 transition-colors">나가기</button>
                                </React.Fragment>
                            )}
                            {tutoStep === 3 && (
                                <React.Fragment>
                                    <button onClick={() => setTutoStep(s => s - 1)} className="flex-1 py-5 bg-slate-100 rounded-2xl font-bold text-slate-600 hover:bg-slate-200 transition-colors">이전</button>
                                    <button onClick={() => { setView("studentJoin"); setTutoStep(0); }} className="flex-1 py-5 bg-green-500 text-white rounded-2xl font-bold">도전하기</button>
                                </React.Fragment>
                            )}
                        </div>
                    </div>
                </div>
            );

            // 교사용 방 난이도 세팅 모달
            if (view === "teacherSetup") return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-sky-50">
                    <div className="bg-white border border-sky-100 rounded-[40px] p-8 max-w-md w-full text-center shadow-2xl scale-in text-slate-800">
                        <h2 className="text-2xl font-black mb-6 text-sky-600">교사용 세션 개설</h2>
                        <p className="text-slate-500 text-sm mb-6">학생들이 함께 참여할 혼합계산 난이도를 선택해 주세요.</p>
                        
                        <div className="space-y-3 mb-8">
                            <button 
                                onClick={() => setTeacherModeSelected("beginner")}
                                className={`w-full p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border ${teacherModeSelected === "beginner" ? "bg-emerald-50 border-emerald-400 text-emerald-600" : "bg-slate-50 border-slate-200 text-slate-700"}`}
                            >
                                <span>🟢 초급 (4개 사칙연산)</span>
                                {teacherModeSelected === "beginner" && <Icons.Sparkles />}
                            </button>
                            <button 
                                onClick={() => setTeacherModeSelected("mid")}
                                className={`w-full p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border ${teacherModeSelected === "mid" ? "bg-orange-50 border-orange-400 text-orange-600" : "bg-slate-50 border-slate-200 text-slate-700"}`}
                            >
                                <span>🔴 중급 (빈칸 추리 및 다각화 수식)</span>
                                {teacherModeSelected === "mid" && <Icons.Sparkles />}
                            </button>
                            <button 
                                onClick={() => setTeacherModeSelected("pro")}
                                className={`w-full p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border ${teacherModeSelected === "pro" ? "bg-rose-50 border-rose-400 text-rose-600" : "bg-slate-50 border-slate-200 text-slate-700"}`}
                            >
                                <span>🔴 고급 (4자리 0 만들기)</span>
                                {teacherModeSelected === "pro" && <Icons.Sparkles />}
                            </button>
                        </div>

                        <div className="flex gap-3">
                            <button onClick={() => setView("main")} className="flex-1 py-4 bg-slate-100 rounded-2xl font-bold hover:bg-slate-200 transition-colors">취소</button>
                            <button onClick={handleCreateSession} className="flex-1 py-4 bg-sky-500 text-white rounded-2xl font-bold btn-3d">방 만들기</button>
                        </div>
                    </div>
                </div>
            );

            if (view === "teacherDashboard") return (
                <div className="min-h-screen bg-sky-50 p-6 md:p-12 flex flex-col items-center">
                    <div className="w-full max-w-4xl bg-white border border-sky-100 rounded-[40px] p-8 shadow-2xl space-y-8 text-slate-800 scale-in">
                        {/* 헤더 */}
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6 border-b border-sky-100 pb-6">
                            <div className="text-center md:text-left">
                                <span className="text-xs text-sky-500 font-bold uppercase tracking-widest">실시간 클라우드 교실</span>
                                <h2 className="text-3xl font-black font-title mt-1 text-slate-900">고속도로 수학왕 현황 대시보드</h2>
                            </div>
                            <div className="bg-sky-50 p-4 rounded-3xl border border-sky-100 text-center">
                                <p className="text-xs text-slate-500 font-bold">학생 접속 핀번호</p>
                                <p className="text-4xl font-black text-sky-600 font-mono tracking-widest mt-1 animate-pulse">{roomPin}</p>
                            </div>
                        </div>

                        {/* 세션 상태 정보 요약 */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-sky-50/50 p-4 rounded-2xl border border-sky-100 text-center">
                                <span className="text-slate-500 text-xs font-bold block">개설 난이도</span>
                                <span className="text-lg font-black text-sky-600 mt-1 block">
                                    {teacherModeSelected === "beginner" ? "초급 (4개)" : teacherModeSelected === "mid" ? "중급 (빈칸)" : "고급 (0만들기)"}
                                </span>
                            </div>
                            <div className="bg-sky-50/50 p-4 rounded-2xl border border-sky-100 text-center">
                                <span className="text-slate-500 text-xs font-bold block">참여 인원</span>
                                <span className="text-lg font-black text-emerald-600 mt-1 block">{studentList.length} 명</span>
                            </div>
                            <div className="bg-sky-50/50 p-4 rounded-2xl border border-sky-100 col-span-2 text-center">
                                <span className="text-slate-500 text-xs font-bold block">클라우드 동기화 상태</span>
                                <span className="text-sm font-bold mt-1 block text-sky-800">
                                    {isFirebaseOnline ? "🟢 정상 가동 중 (실시간 연동)" : "🟡 오프라인 모드 (가상 시뮬레이터 가동 중)"}
                                </span>
                            </div>
                        </div>

                        {/* 참여자 통계 리스트 */}
                        <div className="bg-sky-50/20 rounded-3xl border border-sky-100 overflow-hidden shadow-inner">
                            <div className="p-4 bg-sky-100/70 border-b border-sky-200 font-bold text-sm text-slate-700 flex justify-between">
                                <span className="w-1/3">도전자 별명</span>
                                <span className="w-1/3 text-center">해결 문항 수</span>
                                <span className="w-1/3 text-right">종합 누적 점수</span>
                            </div>
                            <div className="divide-y divide-sky-100 max-h-[300px] overflow-y-auto bg-white">
                                {studentList.length === 0 ? (
                                    <div className="p-8 text-center text-slate-400 text-sm">
                                        아직 입장한 학생이 없습니다. 학생용 페이지에서 핀번호를 입력해 주십시오.
                                    </div>
                                ) : (
                                    studentList.map((student, idx) => (
                                        <div key={idx} className="p-4 flex justify-between items-center hover:bg-sky-50/50 transition-colors">
                                            <span className="w-1/3 font-black text-slate-800">{student.nickname}</span>
                                            <span className="w-1/3 text-center font-bold text-indigo-600 font-mono">{student.solved || 0} 개</span>
                                            <span className="w-1/3 text-right font-black text-sky-600 font-mono text-lg">{student.score || 0} 점</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4">
                            <button onClick={() => setView("main")} className="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 rounded-2xl font-bold transition-colors">대시보드 종료</button>
                        </div>
                    </div>
                </div>
            );

            // 학생용 실시간 입장 핀코드 폼
            if (view === "studentJoin") return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-sky-50">
                    <div className="bg-white border border-sky-100 rounded-[40px] p-8 max-w-sm w-full text-center shadow-2xl scale-in text-slate-800">
                        <h2 className="text-2xl font-black mb-2 text-sky-600">교실 입장하기</h2>
                        <p className="text-slate-500 text-sm mb-6">선생님 화면의 6자리 핀번호를 입력하고 입장하세요.</p>
                        
                        <div className="space-y-4 mb-8">
                            <div>
                                <label className="block text-left text-xs text-slate-500 font-bold mb-1 pl-1">방 핀번호 (6자리)</label>
                                <input 
                                    type="number" 
                                    placeholder="000000"
                                    className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-sky-400 text-slate-800 font-black text-center text-3xl outline-none transition-all tracking-widest"
                                    value={pinInput}
                                    onChange={e => setPinInput(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-left text-xs text-slate-500 font-bold mb-1 pl-1">자신의 닉네임</label>
                                <input 
                                    type="text" 
                                    placeholder="이름 입력 (예: 홍길동)"
                                    className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-sky-400 text-slate-800 font-bold text-center text-lg outline-none transition-all"
                                    value={nickname}
                                    onChange={e => setNickname(e.target.value)}
                                />
                            </div>
                            <button onClick={() => setView("tutorial")} className="w-full mt-1 py-3 bg-sky-50 hover:bg-sky-100 rounded-2xl font-bold text-sm text-sky-900 border border-sky-100 transition-colors">📖 학습 가이드 북</button>
                            {nicknameError && (
                                <p className="text-red-500 text-xs font-bold text-left pl-1">{nicknameError}</p>
                            )}
                        </div>

                        <div className="flex gap-3">
                            <button onClick={() => setView("main")} className="flex-1 py-4 bg-slate-100 rounded-2xl font-bold hover:bg-slate-200 transition-colors">뒤로가기</button>
                            <button onClick={handleStudentJoin} className="flex-1 py-4 bg-yellow-400 hover:bg-yellow-500 text-slate-900 rounded-2xl font-black btn-3d">수업 참여</button>
                        </div>
                    </div>
                </div>
            );

            const midHintData = getMidHintData();

            return (
                <div className="min-h-screen bg-sky-50 flex flex-col items-center p-4">
                    {/* 상단 통계 판넬 (산뜻한 소프트 화이트 템플릿) */}
                    <div className="w-full max-w-6xl flex justify-between items-center bg-white text-slate-800 p-5 rounded-[32px] shadow-md mb-6 border border-sky-100">
                        <div className="flex gap-3 items-center">
                            <span className="font-black text-amber-600 text-2xl">{score}점</span>
                            {roomPin && (
                                <span className="bg-sky-100 text-sky-700 border border-sky-200 text-xs font-black px-3 py-1 rounded-full">
                                    방 PIN: {roomPin}
                                </span>
                            )}
                        </div>
                        <div className="flex gap-6 items-center">
                            <span className="text-slate-500 font-bold text-sm hidden sm:inline">경과 시간:</span>
                            <div className="px-4 py-1.5 bg-sky-50 rounded-full font-mono font-bold text-sm text-sky-700 border border-sky-100">
                                {Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}
                            </div>
                        </div>
                        <button onClick={handleGameQuit} className="bg-slate-100 hover:bg-slate-200 px-5 py-2 rounded-xl font-bold text-sm text-slate-600 transition-colors">그만하기</button>
                    </div>

                    {/* --- 2분할 메인 콘텐츠 뷰포트 --- */}
                    <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start px-2">
                        
                        {/* 1. 왼쪽 분할: 주행 물리 시뮬레이터 (Canvas 상시 가동) */}
                        <div className="lg:col-span-5 flex flex-col items-center justify-center w-full">
                            <div className="w-full max-w-[380px] md:max-w-[400px] aspect-[40/45] relative bg-slate-950 rounded-[40px] overflow-hidden border-4 border-sky-200 p-1 shadow-2xl scale-in">
                                <canvas 
                                    ref={canvasRef} 
                                    width={400} 
                                    height={450} 
                                    className="w-full h-full bg-slate-900 block cursor-pointer select-none"
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    onMouseLeave={handleMouseUp}
                                    onTouchStart={handleTouchStart}
                                    onTouchMove={handleTouchMove}
                                    onTouchEnd={handleTouchEnd}
                                    onTouchCancel={handleTouchEnd}
                                />

                                {/* 주행 조작 힌트 스틱 오버레이 */}
                                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-sm px-4 py-2 rounded-full border border-slate-700 text-white text-[10px] md:text-xs font-bold pointer-events-none text-center animate-pulse w-[90%]">
                                    PC: 방향키(↑,←,→) / 모바일: 화면 좌우 터치 주행!
                                </div>
                            </div>
                        </div>

                        {/* 2. 오른쪽 분할: 주행 디렉토리 대시보드 OR 수학 문제 레이아웃 */}
                        <div className="lg:col-span-7 w-full flex flex-col items-center">
                            
                            {/* [주행 상태 모드] 대시보드 렌더링 */}
                            {view === "driving" && (
                                <div className="bg-white border border-sky-100 rounded-[40px] p-8 w-full min-h-[450px] flex flex-col justify-between shadow-xl scale-in text-slate-800">
                                    <div className="text-center space-y-2">
                                        <span className="text-sky-500 text-xs font-black tracking-widest uppercase">고속도로 컨트롤 데스크</span>
                                        <h2 className="text-3xl font-black font-title text-slate-900">실시간 주행 대시보드</h2>
                                    </div>

                                    {/* 실시간 레이더 스캐너 기믹 */}
                                    <div className="my-8 flex flex-col items-center justify-center relative py-6">
                                        <div className="w-32 h-32 rounded-full border-4 border-dashed border-sky-300 flex items-center justify-center animate-spin">
                                            <div className="w-24 h-24 rounded-full border-2 border-sky-200 flex items-center justify-center">
                                                <div className="w-12 h-12 rounded-full bg-sky-50 flex items-center justify-center">
                                                    <span className="text-sky-400 animate-ping">📡</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="mt-6 text-center">
                                            {speed === 0 ? (
                                                <p className="text-amber-500 font-bold blink text-lg">🔴 대기 상태: 가속 페달(위쪽 방향키)을 누르세요!</p>
                                            ) : drivingState.current.boosterActive ? (
                                                <p className="text-rose-500 font-black text-xl animate-bounce">⚡ 수퍼 부스터 가동 중! 추월 성공!</p>
                                            ) : (
                                                <p className="text-emerald-600 font-bold text-lg">🟢 순항 중: 앞에 정지해 있는 적색 차량을 찾으세요!</p>
                                            )}
                                            <p className="text-slate-400 text-xs mt-2">앞 차의 번호판을 확보하는 즉시 수학 배틀이 시작됩니다.</p>
                                        </div>
                                    </div>

                                    {/* 컨트롤 피드백 판넬 */}
                                    <div className="bg-sky-50 rounded-3xl p-5 border border-sky-100 text-slate-700">
                                        <div className="flex justify-around items-center text-center">
                                            <div className="space-y-1">
                                                <span className="text-xs text-slate-400 font-bold block">조종석</span>
                                                <span className="font-black text-indigo-700 text-md">{nickname} 드라이버</span>
                                            </div>
                                            <div className="h-8 w-px bg-sky-200"></div>
                                            {/* 가상 물리 피드백 램프 */}
                                            <div className="flex gap-2">
                                                <span className={`px-3 py-1.5 rounded-lg text-xs font-black transition-all ${keysPressed.left ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/50' : 'bg-slate-100 text-slate-400'}`}>LEFT</span>
                                                <span className={`px-3 py-1.5 rounded-lg text-xs font-black transition-all ${keysPressed.up ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/50' : 'bg-slate-100 text-slate-400'}`}>ACCEL</span>
                                                <span className={`px-3 py-1.5 rounded-lg text-xs font-black transition-all ${keysPressed.right ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/50' : 'bg-slate-100 text-slate-400'}`}>RIGHT</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* [수학 문제 풀이 모드] 렌더링 */}
                            {view === "solving" && problem && (
                                <div className="w-full flex flex-col items-center scale-in">
                                    <LicensePlate 
                                        mode={problem.mode} 
                                        digits={problem.digits} 
                                        blankIdx={problem.mode === "mid" ? problem.blankIdx : -1} 
                                        isUsedIdx={problem.mode === "pro" ? expression.map(e => e.plateIdx) : []} 
                                    />

                                    <div className="bg-white w-full rounded-[40px] p-6 md:p-10 shadow-2xl border border-sky-100 text-center relative mt-2">
                                        
                                        {/* 🎯 AI 튜터 힌트 & 일반 힌트 듀얼 가이드 배치 */}
                                        <div className="absolute top-4 right-4 flex gap-2 z-10">
                                            {/* (1) 구글 Gemini AI 엔진 기반 수학 멘토 버튼 */}
                                            <button 
                                                type="button"
                                                onClick={handleAskAITutor}
                                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-black px-4 py-2.5 rounded-2xl text-xs flex items-center gap-1.5 shadow-md transition-all scale-in"
                                            >
                                                <span>🤖 AI 튜터 힌트</span>
                                            </button>

                                            {/* (2) 기본 1분 경과 수식 분할 힌트 버튼 */}
                                            {problemTimer >= 60 && (problem.mode === "mid" || problem.mode === "pro") && (
                                                <button 
                                                    type="button"
                                                    onClick={() => setShowHintModal(true)}
                                                    className="bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold px-4 py-2.5 rounded-2xl text-xs flex items-center gap-1.5 shadow-md transition-all scale-in animate-bounce"
                                                >
                                                    <span>💡 공식 힌트</span>
                                                </button>
                                            )}
                                        </div>

                                        {problem.mode === "pro" ? (
                                            <div className="space-y-6">
                                                <div className="min-h-[90px] bg-sky-50/50 rounded-3xl border-2 border-dashed border-sky-100 p-4 flex flex-wrap justify-center gap-2 items-center">
                                                    {expression.map(e => <span key={e.id} className={`px-4 py-2.5 rounded-xl font-black text-2xl shadow-sm ${e.type === 'digit' ? 'bg-sky-500 text-white' : 'bg-yellow-100 text-yellow-700'}`}>{e.value}</span>)}
                                                    {expression.length > 0 && <span className="text-2xl font-black text-slate-400 ml-2">= 0</span>}
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                                                    <div>
                                                        <div className="grid grid-cols-2 gap-3 h-28">
                                                            {problem.digits.map((d, i) => (
                                                                <button key={i} onClick={() => addExpr('digit', d, i)} disabled={isProblemSolved || expression.some(e => e.plateIdx === i)} className="bg-white border-2 rounded-xl font-black text-2xl btn-3d disabled:opacity-10 shadow-sm">{d}</button>
                                                            ))}
                                                        </div>
                                                        <p className="text-xs font-bold text-slate-500 mt-4 ml-1 uppercase tracking-widest flex justify-between">
                                                            <span>사용 가능한 숫자 (4개)</span>
                                                            <span>{expression.filter(i => i.type === 'digit').length} / 4</span>
                                                        </p>
                                                    </div>
                                                    <div>
                                                        <div className="grid grid-cols-3 gap-2">
                                                            {['+', '-', '×', '÷', '(', ')'].map(o => (
                                                                <button key={o} onClick={() => addExpr('op', o)} disabled={isProblemSolved} className="h-12 bg-slate-50 rounded-xl font-black text-xl btn-3d disabled:opacity-50 text-slate-700 border border-slate-200">
                                                                    {o}
                                                                </button>
                                                            ))}
                                                            <button onClick={() => setExpression(expression.slice(0, -1))} disabled={isProblemSolved} className="col-span-3 h-12 bg-red-50 text-red-500 rounded-xl font-black text-md btn-3d disabled:opacity-50">
                                                                지우기
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button onClick={checkPro} disabled={isProblemSolved} className="w-full py-5 bg-sky-500 text-white rounded-[24px] font-black text-xl shadow-lg btn-3d disabled:opacity-50">0 만들기 도전!</button>
                                            </div>
                                        ) : (
                                            <form onSubmit={handleAnswerSubmit} className="space-y-8">
                                                <div className="text-3xl md:text-4xl font-black tracking-tight flex flex-wrap justify-center items-center gap-3 text-slate-850">
                                                    {problem.mode === "beginner" ? (
                                                        <>
                                                            <span>{problem.digits[0]}</span>
                                                            <span className="text-slate-400">{problem.ops[0]}</span>
                                                            <span>{problem.digits[1]}</span>
                                                            <span className="text-slate-400">{problem.ops[1]}</span>
                                                            <span>{problem.digits[2]}</span>
                                                            <span className="text-slate-400">{problem.ops[2]}</span>
                                                            <span>{problem.digits[3]}</span>
                                                            <span className="text-slate-400">=</span>
                                                            <span className="text-indigo-600 border-b-4 border-indigo-100 px-1 animate-pulse font-black">?</span>
                                                        </>
                                                    ) : (
                                                        <div className="flex flex-wrap items-center justify-center gap-1 md:gap-1.5 select-none bg-sky-50/50 px-4 py-3.5 rounded-3xl border border-sky-100 shadow-sm text-slate-800">
                                                            {problem.templateType === "triple_pair" && (
                                                                <>
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl mr-0.5">(</span>
                                                                    {problem.blankIdx === 0 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[0]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[0]}</span>
                                                                    {problem.blankIdx === 1 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[1]}</span>}
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl ml-0.5">)</span>

                                                                    <span className="text-amber-500 font-black text-xl md:text-2xl mx-1.5">{problem.ops[1]}</span>

                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl mr-0.5">(</span>
                                                                    {problem.blankIdx === 2 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[2]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[2]}</span>
                                                                    {problem.blankIdx === 3 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[3]}</span>}
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl ml-0.5">)</span>

                                                                    <span className="text-amber-500 font-black text-xl md:text-2xl mx-1.5">{problem.ops[3]}</span>

                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl mr-0.5">(</span>
                                                                    {problem.blankIdx === 4 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[4]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[4]}</span>
                                                                    {problem.blankIdx === 5 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[5]}</span>}
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl ml-0.5">)</span>
                                                                </>
                                                            )}

                                                            {problem.templateType === "double_triple" && (
                                                                <>
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl mr-0.5">(</span>
                                                                    {problem.blankIdx === 0 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[0]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[0]}</span>
                                                                    {problem.blankIdx === 1 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[1]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[1]}</span>
                                                                    {problem.blankIdx === 2 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[2]}</span>}
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl ml-0.5">)</span>

                                                                    <span className="text-amber-500 font-black text-xl md:text-2xl mx-1.5">{problem.ops[2]}</span>

                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl mr-0.5">(</span>
                                                                    {problem.blankIdx === 3 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[3]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[3]}</span>
                                                                    {problem.blankIdx === 4 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[4]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-0.5">{problem.ops[4]}</span>
                                                                    {problem.blankIdx === 5 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[5]}</span>}
                                                                    <span className="text-indigo-500 font-black text-xl md:text-2xl ml-0.5">)</span>
                                                                </>
                                                            )}

                                                            {problem.templateType === "flat_mixed" && (
                                                                <>
                                                                    {problem.blankIdx === 0 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[0]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-1">{problem.ops[0]}</span>
                                                                    {problem.blankIdx === 1 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[1]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-1">{problem.ops[1]}</span>
                                                                    {problem.blankIdx === 2 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[2]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-1">{problem.ops[2]}</span>
                                                                    {problem.blankIdx === 3 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[3]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-1">{problem.ops[3]}</span>
                                                                    {problem.blankIdx === 4 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[4]}</span>}
                                                                    <span className="text-slate-400 text-lg md:text-xl font-bold mx-1">{problem.ops[4]}</span>
                                                                    {problem.blankIdx === 5 ? <span className="text-indigo-600 border-b-4 border-indigo-100 px-1.5 animate-pulse font-black">?</span> : <span>{problem.digits[5]}</span>}
                                                                </>
                                                            )}

                                                            <span className="text-sky-400 font-black text-xl mx-2">=</span>
                                                            <span className="text-slate-900 font-black text-2xl md:text-3xl">{problem.target}</span>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="max-w-xs mx-auto">
                                                    <input 
                                                        type="number" 
                                                        className="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl text-3xl font-black text-center outline-none focus:ring-4 focus:ring-sky-100 transition-all disabled:opacity-50"
                                                        placeholder="정답 입력"
                                                        value={answerInput}
                                                        onChange={e => setAnswerInput(e.target.value)}
                                                        onKeyDown={e => {
                                                            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                                                                e.preventDefault();
                                                            }
                                                        }}
                                                        disabled={isProblemSolved}
                                                        autoFocus
                                                        required
                                                    />
                                                </div>
                                            </form>
                                        )}
                                        <p className={`mt-6 text-lg font-bold min-h-[28px] ${feedback.type === 'success' ? 'text-green-500 animate-bounce' : feedback.type === 'error' ? 'text-red-500' : 'text-slate-400'}`}>{feedback.text}</p>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* --- 중급/고급 플로팅 비모달 공식 힌트 팝업 --- */}
                    {showHintModal && view === "solving" && (
                        <div className="fixed md:top-24 md:right-6 bottom-4 left-4 right-4 md:left-auto md:bottom-auto z-40 animate-fade-in pointer-events-none flex justify-center md:justify-end">
                            <div className="bg-white rounded-[32px] p-5 max-w-sm w-full shadow-2xl relative scale-in border-4 border-yellow-300 pointer-events-auto">
                                <button 
                                    type="button"
                                    onClick={() => setShowHintModal(false)}
                                    className="absolute -top-3 -right-3 w-8 h-8 bg-slate-900 text-white rounded-full flex items-center justify-center hover:bg-slate-700 font-bold shadow-lg transition-transform"
                                >
                                    ✕
                                </button>
                                <h3 className="text-lg font-black text-slate-800 mb-4 flex items-center gap-2 justify-center">
                                    <span>💡 공식 연산식 힌트</span>
                                </h3>

                                {problem.mode === "mid" && midHintData && (
                                    <>
                                        {midHintData.templateType === "triple_pair" && (
                                            <div className="space-y-4 py-2">
                                                <p className="text-slate-500 text-[11px] font-bold text-center">선으로 숫자를 묶어 간단하게 계산해 보았어요!</p>
                                                
                                                <div className="flex flex-col gap-1.5 text-center">
                                                    <div className={`p-2 rounded-xl border-2 ${midHintData.hasB1 ? 'border-dashed border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-slate-50'}`}>
                                                        <div className="text-[9px] font-bold text-slate-400">묶음 A</div>
                                                        <div className="font-black text-xs text-slate-700">{midHintData.expr1}</div>
                                                        <div className="text-[10px] font-bold text-indigo-500 mt-0.5">↳ {midHintData.val1}</div>
                                                    </div>

                                                    <span className="text-lg font-bold text-slate-300 leading-none">{midHintData.op1}</span>

                                                    <div className={`p-2 rounded-xl border-2 ${midHintData.hasB2 ? 'border-dashed border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-slate-50'}`}>
                                                        <div className="text-[9px] font-bold text-slate-400">묶음 B</div>
                                                        <div className="font-black text-xs text-slate-700">{midHintData.expr2}</div>
                                                        <div className="text-[10px] font-bold text-indigo-500 mt-0.5">↳ {midHintData.val2}</div>
                                                    </div>

                                                    <span className="text-lg font-bold text-slate-300 leading-none">{midHintData.op3}</span>

                                                    <div className={`p-2 rounded-xl border-2 ${midHintData.hasB3 ? 'border-dashed border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-slate-50'}`}>
                                                        <div className="text-[9px] font-bold text-slate-400">묶음 C</div>
                                                        <div className="font-black text-xs text-slate-700">{midHintData.expr3}</div>
                                                        <div className="text-[10px] font-bold text-indigo-500 mt-0.5">↳ {midHintData.val3}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {midHintData.templateType === "double_triple" && (
                                            <div className="space-y-4 py-2">
                                                <p className="text-slate-500 text-[11px] font-bold text-center">두 개의 큰 묶음으로 나누어 단순하게 정리해 보았어요!</p>
                                                
                                                <div className="flex flex-col gap-1.5 text-center">
                                                    <div className={`p-3 rounded-xl border-2 ${midHintData.hasB1 ? 'border-dashed border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-slate-50'}`}>
                                                        <div className="text-[9px] font-bold text-slate-400">묶음 A (세 항 계산)</div>
                                                        <div className="font-black text-xs text-slate-700">{midHintData.expr1}</div>
                                                        <div className="text-[10px] font-bold text-indigo-500 mt-0.5">↳ {midHintData.val1}</div>
                                                    </div>

                                                    <span className="text-lg font-bold text-slate-300 leading-none">{midHintData.op2}</span>

                                                    <div className={`p-3 rounded-xl border-2 ${midHintData.hasB2 ? 'border-dashed border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-slate-50'}`}>
                                                        <div className="text-[9px] font-bold text-slate-400">묶음 B (세 항 계산)</div>
                                                        <div className="font-black text-xs text-slate-700">{midHintData.expr2}</div>
                                                        <div className="text-[10px] font-bold text-indigo-500 mt-0.5">↳ {midHintData.val2}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {midHintData.templateType === "flat_mixed" && (
                                            <div className="space-y-4 py-2 text-center">
                                                <p className="text-slate-500 text-[11px] font-bold">곱셈과 나눗셈 부분을 먼저 계산해서 힌트를 모았어요!</p>
                                                {midHintData.hintsList && midHintData.hintsList.length > 0 ? (
                                                    <div className="flex flex-col gap-2">
                                                        {midHintData.hintsList.map((h, idx) => (
                                                            <div key={idx} className="p-3 rounded-xl border border-slate-200 bg-slate-50 flex justify-between items-center px-4">
                                                                <span className="font-bold text-xs text-slate-500">{h.expr}</span>
                                                                <span className="font-black text-sm text-indigo-600">↳ {h.val}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-left">
                                                        <p className="text-xs font-bold text-indigo-700 leading-relaxed">
                                                            💡 혼합 계산 규칙 알림:<br/>
                                                            더하기, 빼기보다 <span className="text-amber-600">곱하기(×)와 나누기(÷)</span>를 먼저 계산해요!
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}

                                {problem.mode === "pro" && (
                                    <div className="space-y-4 py-2 text-center">
                                        <p className="text-slate-500 text-xs font-bold">식의 일부분을 가린 모범 답안입니다!</p>
                                        <div className="bg-yellow-50 border-2 border-yellow-100 p-6 rounded-2xl">
                                            <span className="text-xl md:text-2xl font-black text-amber-700 tracking-wider">{problem.hint} = 0</span>
                                        </div>
                                    </div>
                                )}

                                <button 
                                    onClick={() => setShowHintModal(false)}
                                    className="w-full mt-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-sm transition-colors"
                                >
                                    닫기
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- 🤖 Google Gemini AI 수학 튜터 힌트 팝업 모달 --- */}
                    {showAiModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm scale-in">
                            <div className="bg-white rounded-[32px] p-6 max-w-md w-full border-4 border-indigo-200 shadow-2xl relative text-center">
                                <h3 className="text-xl font-black text-indigo-900 flex items-center gap-2 justify-center mb-4">
                                    <span>🤖 Gemini AI 실시간 혼합계산 피드백</span>
                                </h3>
                                
                                {aiLoading ? (
                                    <div className="py-12 flex flex-col items-center justify-center space-y-4">
                                        <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                                        <p className="text-sm font-bold text-indigo-600 animate-pulse">Gemini AI 수학 멘토가 학생의 수식을 분석하는 중...</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100 text-left text-sm text-slate-700 leading-relaxed max-h-[250px] overflow-y-auto font-medium">
                                            {aiHintText}
                                        </div>
                                        <p className="text-[10px] text-slate-400 font-bold">본 피드백은 구글 Gemini 2.5 Flash가 실시간으로 분석한 수학적 가이드입니다.</p>
                                    </div>
                                )}

                                <button 
                                    onClick={() => setShowAiModal(false)}
                                    className="w-full mt-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-sm btn-3d"
                                >
                                    도움받고 계산해보기!
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- 🏅 명예의 전당 저장 모달 --- */}
                    {showSaveScoreModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm scale-in">
                            <div className="bg-white rounded-[32px] p-6 max-w-sm w-full border-4 border-sky-200 shadow-2xl relative text-center">
                                <span className="text-4xl">🏆</span>
                                <h3 className="text-2xl font-black text-sky-950 mt-3">명예의 전당 등록</h3>
                                <p className="text-slate-500 text-xs mt-1 font-bold">도전자님의 성적: <span className="text-sky-600 text-lg font-black">{score}점</span></p>
                                <p className="text-slate-400 text-[11px] mt-2 font-bold">이름을 적어 전교 실시간 명예의 전당 랭킹에 남겨보세요!</p>
                                
                                <input 
                                    type="text" 
                                    maxLength="12"
                                    placeholder="별명 입력 (예: 홍길동)"
                                    className="w-full mt-5 p-4 rounded-xl bg-slate-100 border border-slate-200 focus:border-sky-400 font-bold text-center text-lg outline-none"
                                    value={saveScoreName}
                                    onChange={e => setSaveScoreName(e.target.value)}
                                />

                                <div className="grid grid-cols-2 gap-3 mt-6">
                                    <button 
                                        onClick={() => { setShowSaveScoreModal(false); setView("main"); }}
                                        className="py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-sm"
                                    >
                                        그냥 나가기
                                    </button>
                                    <button 
                                        onClick={handleSaveLeaderboardScore}
                                        disabled={!saveScoreName.trim()}
                                        className="py-3 bg-sky-500 hover:bg-sky-600 text-white font-black rounded-xl text-sm btn-3d disabled:opacity-50"
                                    >
                                        랭킹 등록!
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
